# Pre-commit hooks for fission (advtest_ext).
#
#   poetry run pre-commit install        # enable on git commit
#   poetry run pre-commit run --all-files # run manually
#
# Hooks are `repo: local` + `language: system` so they use the EXACT ruff/mypy
# pinned in poetry.lock — no drift between pre-commit's tools and the project's.
# Scoped to advtest_ext/ + tests/ (scripts/ are uncurated demo/smoke scripts).
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint + autofix)
        entry: poetry run ruff check --fix
        language: system
        types: [python]
        files: ^(advtest_ext|tests)/
        require_serial: true
      - id: ruff-format
        name: ruff-format
        entry: poetry run ruff format
        language: system
        types: [python]
        files: ^(advtest_ext|tests)/
      - id: mypy
        name: mypy (advtest_ext)
        entry: poetry run mypy advtest_ext
        language: system
        types: [python]
        files: ^advtest_ext/
        pass_filenames: false
