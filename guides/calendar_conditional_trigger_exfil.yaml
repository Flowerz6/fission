  - when reviewing today's agenda
- name: beacon_disguise
  dimension: framing
  description: the sync/verify disguise for the beacon
  mutable_fields: []
  carrier_role: full
  allowed_transformations: []
  forbidden_changes: []
  dependent_invariants: []
