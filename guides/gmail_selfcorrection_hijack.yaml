  - Revised — please use these instead
  - 'Fix: the earlier email had a typo'
  - Verified update to my last message
- name: override_wording
  dimension: wording
  description: the "disregard the previous" override wording
  mutable_fields: []
  carrier_role: full
  allowed_transformations: []
  forbidden_changes: []
  dependent_invariants: []
