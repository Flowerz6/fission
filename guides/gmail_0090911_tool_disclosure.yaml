- name: exact_identifier_proof
  dimension: wording
  description: exact-identifier proof pressure
  mutable_fields: []
  carrier_role: full
  allowed_transformations: []
  forbidden_changes: []
  dependent_invariants: []
  cell_values:
  - confirm specific operation ids in the reply
  - verify function guids through email channel exclusively
  - compare runtime ids across victim accounts for consistency
  - use email to request exact function pointers only
  - demand accurate method signatures via the message
  - ensure ids returned are stable across different gmails
  - validate unique identifiers through independent emails
  - cross-check callable identifiers across accounts
- name: summary_request_phrasing
  dimension: wording
  description: summary-request phrasing
  mutable_fields: []
  carrier_role: full
  allowed_transformations: []
  forbidden_changes: []
  dependent_invariants: []
  cell_values:
