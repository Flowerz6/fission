  - verbose and polite
  - technical jargon
  - plain casual
- name: order_labels_forced
  dimension: turn_order
  description: order and labels of the forced disclosure table
  mutable_fields: []
  carrier_role: full
  allowed_transformations: []
  forbidden_changes: []
  dependent_invariants: []
  cell_values:
