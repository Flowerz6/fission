# These are sanitised demonstrations preserving the format Anil 2024 (MSJ)
# requires — alternating user/assistant turns showing apparent compliance
# with abstract harmful queries. The instructions are non-operational so
# this catalogue is publishable.
#
# Production runs against frontier models use a curated catalogue with
# operationally-shaped demonstrations, not shipped in this repo.
#
# Reference: anil2024msj
#
# ---
#
# Each entry is a (user, assistant) pair where the assistant *complies*
# with a harmful-shaped query. The MSJ mechanism is to stack many of
# these in the model's context so the model picks up the pattern of
# compliance and continues it on the final user query.
#
# Used by advtest_ext.attacks.msj.MsjGenerator. Sampling is with
# replacement when n_shots > len(demonstrations).

