{% extends "base.html" %}
{% block title %}Findings · Fission{% endblock %}
{% block content %}
<div class="head-bar">
  <div class="ht">
    <p class="eyebrow" style="margin:0">Assessment</p>
    <h1>Findings</h1>
    <p>Explore, triage and manage all findings.</p>
  </div>
</div>

<form method="get" class="ptoolbar filter-bar" hx-get="/findings" hx-target="#findings-table" hx-swap="innerHTML" hx-trigger="change" hx-push-url="true">
  <input type="hidden" name="service" value="{{ selected_service.key }}">
  <div class="searchbox">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M11 11l3 3"/></svg>
    <input type="text" aria-label="Search findings" id="finding-search" placeholder="Search findings…" oninput="filterFindings(this.value)">
  </div>
  <select class="selectbox" name="severity" aria-label="Severity">
    <option value="">All severities</option>
    {% for s in ('low', 'med', 'high', 'critical') %}
    <option value="{{ s }}" {% if severity == s %}selected{% endif %}>{{ s|capitalize }}</option>
    {% endfor %}
  </select>
  <select class="selectbox" name="run_id" aria-label="Run">
    <option value="">All runs</option>
    {% for rid, rname in run_options %}
    <option value="{{ rid }}" {% if run_id == rid %}selected{% endif %}>{{ rname }}</option>
    {% endfor %}
  </select>
  <select class="selectbox" name="behavior_id" aria-label="Scenario">
    <option value="">All scenarios</option>
    {% for b in behavior_options %}
    <option value="{{ b }}" {% if behavior_id == b %}selected{% endif %}>{{ objective_label(b) }}</option>
    {% endfor %}
  </select>
<noscript><button class="btn-outline" type="submit">Apply filters</button></noscript></form>

<div id="findings-table">
  {% include "findings/_table.html" %}
</div>

<script>
  document.addEventListener('htmx:afterSwap', function(){
    filterFindings(document.getElementById('finding-search').value);
  });
  function filterFindings(q) {
    q = (q || "").toLowerCase();
    document.querySelectorAll('#findings-table tbody tr').forEach(function (tr) {
      tr.hidden = q && tr.textContent.toLowerCase().indexOf(q) === -1;
    });
  }
</script>
{% endblock %}
