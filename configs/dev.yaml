# Dev profile — everything points at the local vLLM server so we get
# realistic responses without paying anyone. Used for stub realism and
# the inner development loop.
#
# Start the server with: scripts/start_vllm.sh dev

ATTACKER_MODEL:
  provider_type: local_vllm
  endpoint: http://localhost:11434/v1
  model_id: qwen2.5:7b-instruct
  max_tokens: 1024
  temperature: 0.7

JUDGE_MODEL:
  provider_type: local_vllm
  endpoint: http://localhost:11434/v1
  model_id: qwen2.5:7b-instruct
  max_tokens: 256
  temperature: 0.0

# On-mechanism checker for tap_crescendo (report §6.3). Deliberately a
# LOCAL model, family-disjoint from both the Claude attacker and the
# Gemini target — so the attacker never grades whether its own turns are
# on-mechanism (preference-leakage bias). Binary ON/OFF verdict; a 7B
# model is ample. Local, so per-turn drift checking is effectively free.
CHECKER_MODEL:
  provider_type: local_vllm
  endpoint: http://localhost:11434/v1
  model_id: qwen2.5:7b-instruct
  max_tokens: 8
  temperature: 0.0

TARGET_MODEL_DEV:
  provider_type: local_vllm
  endpoint: http://localhost:11434/v1
  model_id: qwen2.5:7b-instruct
  max_tokens: 1024
  temperature: 0.7

# Gemini-for-Workspace target. Used by the Workspace adapter
# integration tests (gated behind ADVTEST_WORKSPACE_INTEGRATION=1)
# and by anything else that wants to talk to a real Gemini model
# from the dev profile. Set GEMINI_API_KEY in your shell first.
GEMINI_TARGET:
  provider_type: gemini
  api_key_env: GEMINI_API_KEY
  model_id: gemini-2.5-flash
  max_tokens: 1024
  temperature: 0.7

# Claude-as-judge. Wire StrongRejectJudge (Souly 2024 rubric) or
# DecomposedIpiJudge at this provider for nuanced scoring — Qwen-7B
# over-refuses on the rubric and pulls overall_asr to 0.
#
# Two Sonnet-5 specifics, both load-bearing for the judge:
#   * temperature is DROPPED, not sent (see providers/anthropic.py
#     ``_TEMPERATURE_REJECTING_MODELS``) — a non-default value is a 400.
#     The 0.0 below is retained as documentation of intent and as the
#     value used if this role is ever pointed back at a 4.6-era model.
#   * adaptive thinking is ON by default (4.6 ran thinking-off when the
#     parameter was omitted), and max_tokens caps thinking + reply
#     TOGETHER. Judge replies are a handful of lines; the whole budget
#     is headroom for the thinking that now precedes them. 512 returned
#     empty replies on every long trace, and 2048 still did on the
#     longest — the failure is silent (empty text, not an API error),
#     so err high. Unused budget is not billed.
CLAUDE_JUDGE:
  provider_type: anthropic
  api_key_env: ANTHROPIC_API_KEY
  model_id: claude-sonnet-5
  max_tokens: 8192
  temperature: 0.0

# Claude-as-attacker. Used by PAIR / BoN / MSJ refinement loops
# when you want stronger jailbreak generation than Qwen-7B. Note:
# only kicks in for attacks that actually call an attacker LLM —
# IndirectInjectionAttack uses static seed payloads and won't
# touch this role.
CLAUDE_ATTACKER:
  provider_type: anthropic
  api_key_env: ANTHROPIC_API_KEY
  model_id: claude-sonnet-5-5
  # Kept low on purpose: the attacker turn is one short chat message + a
  # one-line reasoning, so a tight cap forces concise, human-sounding turns
  # instead of long formal essays that tip off the target.
  max_tokens: 512
  temperature: 1.0

# Claude-as-PLANNER (strategist). Split from the turn-writing attacker via
# `run_guide --planner-role CLAUDE_PLANNER`; without that flag the planner
# defaults to CLAUDE_ATTACKER. This is the reasoning-heavy role: it reads the
# target's reply + model-thoughts, diagnoses WHY it refused, and authors a
# materially different, legitimacy-framed carrier payload (the artifact_patch).
# That work is Opus-tier — hence the strongest default model.
#   * max_tokens is high on purpose: on current Claude models thinking shares
#     the max_tokens budget with the reply, and a carrier rewrite must emit the
#     whole new document body in artifact_patch. A tight cap lets thinking eat
#     the budget and return an empty patch (silent — re-plants the seed), the
#     same failure documented on CLAUDE_JUDGE above. 8192 matches the strategist
#     call's cap in tap_crescendo.
#   * temperature is accepted for 4.x models and auto-DROPPED for 5.x (Opus/
#     Sonnet 5.x reject a non-default value; see providers/anthropic.py
#     _TEMPERATURE_REJECTING_MODELS) — kept here so the role also works if ever
#     pointed back at a 4.x planner.
CLAUDE_PLANNER:
  provider_type: anthropic
  api_key_env: ANTHROPIC_API_KEY
  model_id: claude-opus-5-5
  max_tokens: 8192
  temperature: 1.0
